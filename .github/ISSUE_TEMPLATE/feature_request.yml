name: Feature or tool request
description: Suggest a new tool, or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like added or changed?
      description: A new tool, a new option on an existing tool, or something else.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: What problem does this solve, and who is it for?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you have tried, if any.
    validations:
      required: false
